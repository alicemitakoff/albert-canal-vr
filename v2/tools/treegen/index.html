<!doctype html><meta charset="utf-8"><title>treegen</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/","@dgreenheck/ez-tree":"https://cdn.jsdelivr.net/npm/@dgreenheck/ez-tree@1.1.0/build/ez-tree.es.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { Tree, TreePreset } from '@dgreenheck/ez-tree';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
const J=x=>JSON.parse(JSON.stringify(x));
// species for the Kempen canal banks: pedunculate oak, Scots pine, silver birch, poplar, ash, young aspen
const V=[
 {id:'oak_m', p:'Oak Medium'},
 {id:'oak_l', p:'Oak Large'},
 {id:'pine_m',p:'Pine Medium', mod:o=>{ o.branch.start['1']=0.48; o.branch.length['1']*=0.95; o.branch.angle['1']=66; o.bark.tint=0xd9a07a; }},
 {id:'pine_l',p:'Pine Large', mod:o=>{ o.branch.start['1']=0.55; o.branch.length['1']*=0.9; o.branch.angle['1']=70; o.bark.tint=0xd9a07a; }},
 {id:'birch', p:'Aspen Medium', mod:o=>{ o.bark.type='birch'; o.bark.tint=0xffffff; o.leaves.tint=0xffffff; }},
 {id:'poplar',p:'Aspen Large', mod:o=>{ o.branch.angle['1']=22; o.branch.angle['2']=28; o.branch.force.strength=0.03; o.branch.length['1']*=0.7; o.leaves.tint=0xffffff; }},
 {id:'ash_m', p:'Ash Medium'},
 {id:'aspen_s',p:'Aspen Small', mod:o=>{ o.leaves.tint=0xffffff; }}
];
function lod1(o){ const q=J(o); q.branch.sections={0:Math.max(3,Math.round(q.branch.sections['0']*0.5)),1:Math.max(2,Math.round(q.branch.sections['1']*0.5)),2:Math.max(1,Math.round(q.branch.sections['2']*0.5)),3:1};
  q.branch.segments={0:Math.max(4,Math.round(q.branch.segments['0']*0.6)),1:3,2:3,3:3}; if(q.branch.levels>=3){ q.branch.levels=2; q.leaves.count=Math.round(q.leaves.count*Math.max(2,(q.branch.children['2']||3))*0.55); q.leaves.size*=1.7; } q.leaves.billboard='single'; return q; }
async function build(o){ const t=new Tree(); t.loadFromJson(o); t.generate(); return t; }
window.run=async()=>{
  const exp=new GLTFExporter(); const out={}; const stats={};
  for(const v of V){
    const base=J(TreePreset[v.p]); if(v.mod) v.mod(base);
    for(const lv of [0,1]){
      const o=lv?lod1(base):base; const t=await build(o);
      const bg=t.branchesMesh.geometry, lg=t.leavesMesh.geometry; bg.computeBoundingBox(); lg.computeBoundingBox();
      const bb=new THREE.Box3().union(bg.boundingBox).union(lg.boundingBox); const h=bb.max.y-bb.min.y;
      const s=1/h; for(const g of [bg,lg]){ g.translate(0,-bb.min.y,0); g.scale(s,s,s); g.deleteAttribute&&0; }
      // leaves: drop the computed normals, the page uses its own lighting for the cards
      const sc=new THREE.Scene(); const mb=new THREE.Mesh(bg,new THREE.MeshStandardMaterial({name:'bark'})); mb.name='bark'; const ml=new THREE.Mesh(lg,new THREE.MeshStandardMaterial({name:'leaves'})); ml.name='leaves'; sc.add(mb,ml);
      const glb=await exp.parseAsync(sc,{binary:true});
      const u8=new Uint8Array(glb); let bin=''; for(let i=0;i<u8.length;i+=32768) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+32768)); const b64=btoa(bin);
      out[v.id+'_'+lv]=b64;
      const tri=g=>(g.index?g.index.count:g.attributes.position.count)/3;
      stats[v.id+'_'+lv]={bark:tri(bg),leaves:tri(lg),width:((bb.max.x-bb.min.x)*s).toFixed(2),barkType:o.bark.type,leafType:o.leaves.type,barkTint:o.bark.tint,leafTint:o.leaves.tint,texScale:o.bark.textureScale,alphaTest:o.leaves.alphaTest};
    }
  }
  return {out,stats};
};
window.ready=true;
</script>
