name: Live barge positions (AIS)
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-ais
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Previous data
        run: |
          mkdir -p live
          if git fetch origin live-data --depth=1; then
            git show origin/live-data:live/ships.json > live/ships.json || echo '{"ships":[]}' > live/ships.json
            git archive origin/live-data live/history 2>/dev/null | tar -x || true
          else
            echo '{"ships":[]}' > live/ships.json
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websockets==12.0
      - name: Listen to AIS for 55 minutes, publish every 5 minutes
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
          LISTEN: "290"
        run: |
          git config user.name "live-ais bot"
          git config user.email "actions@users.noreply.github.com"
          for i in $(seq 1 11); do
            python tools/ais_fetch.py || true
            [ -f live/.ok ] || { echo "no new data in window $i"; continue; }
            rm -f live/.ok
            # keep history lines another run may have written meanwhile
            if git fetch -q origin live-data --depth=1 2>/dev/null; then
              rm -rf /tmp/theirs && mkdir -p /tmp/theirs
              git archive origin/live-data live/history 2>/dev/null | tar -x -C /tmp/theirs || true
              for f in /tmp/theirs/live/history/*.jsonl; do
                [ -f "$f" ] || continue; b=$(basename "$f")
                cat "$f" "live/history/$b" 2>/dev/null | sort -u > /tmp/merged && mv /tmp/merged "live/history/$b"
              done
            fi
            # publish live/ as a single root commit on the live-data branch
            export GIT_INDEX_FILE=/tmp/live-index; rm -f "$GIT_INDEX_FILE"
            git add -f live
            tree=$(git write-tree); unset GIT_INDEX_FILE
            sha=$(git commit-tree "$tree" -m "Live AIS positions")
            git push -qf origin "$sha:refs/heads/live-data" && echo "published window $i ($(date -u +%H:%M))" || echo "publish failed in window $i"
          done
