name: Frozen links check
# The three live links (/demo/, /flat/, /vr/) and the files they load are frozen as on 15 October 2026.
# A full copy is kept on the branch frozen-2026-10-15 and every file's fingerprint is in FROZEN.sha256.
# This check turns red if any frozen file changes. New work goes in the v2 folder.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fingerprints of the frozen files
        run: sha256sum --check --quiet FROZEN.sha256
      - name: Same files as the frozen branch
        run: |
          git fetch origin frozen-2026-10-15
          git diff --exit-code --stat origin/frozen-2026-10-15 HEAD -- index.html demo flat vr assets
      - name: Explain a failure
        if: failure()
        run: echo "::error::Files behind the frozen links changed. Restore them from the branch frozen-2026-10-15 and put new work in the v2 folder."
